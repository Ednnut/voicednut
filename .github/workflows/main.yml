name: Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-miniapp:
    name: Validate Mini App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: miniapp

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install Mini App dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Mini App contracts, lint, and build
        run: npm run validate:prod

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Mini App browser smoke tests
        run: npm run test:e2e

      - name: Run Mini App accessibility checks
        run: npm run test:a11y

  validate-api:
    name: Validate API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci --no-audit --no-fund

      - name: Run API tests and offline provider checks
        run: |
          npm test
          npm run validate:profiles
          npm run parity:providers

  validate-bot:
    name: Validate Bot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: bot

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        run: npm ci --no-audit --no-fund

      - name: Run bot tests
        run: npm test

  deploy:
    name: Deploy via SSH to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - validate-miniapp
      - validate-api
      - validate-bot
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Deploy using SSH
        uses: appleboy/ssh-action@4a03da89e5c43da56e502053be4bbcb293411883 # v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 30m
          script: |
            bash <<'EOF'
            set -euo pipefail

            export NVM_DIR="/home/ubuntu/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "nvm is required to select the supported Node.js 24 runtime" >&2
              exit 1
            fi
            . "$NVM_DIR/nvm.sh"
            if ! nvm use 24; then
              echo "Node.js 24 must be installed on the deployment host before deploying" >&2
              exit 1
            fi
            node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1)"

            for required_command in git node npm pm2 curl grep; do
              if ! command -v "$required_command" >/dev/null 2>&1; then
                echo "Missing required command: $required_command" >&2
                exit 1
              fi
            done

            DEPLOY_ROOT=/home/ubuntu/voxly
            REPO_URL=https://github.com/crampd/voicednut.git
            LOG_ROOT="$DEPLOY_ROOT/logs"

            mkdir -p "$DEPLOY_ROOT"

            if [ ! -d "$DEPLOY_ROOT/.git" ]; then
              git clone --filter=blob:none --no-checkout "$REPO_URL" "$DEPLOY_ROOT"
            fi

            cd "$DEPLOY_ROOT"
            git sparse-checkout init --cone
            git sparse-checkout set api bot

            git fetch --depth=1 origin "${{ github.sha }}"
            git checkout --force "${{ github.sha }}"
            git clean -fd api bot

            mkdir -p "$LOG_ROOT/api" "$LOG_ROOT/bot"

            # Deploy API
            cd "$DEPLOY_ROOT/api"
            npm ci --omit=dev --no-audit --no-fund
            npm run parity:providers
            pm2 startOrRestart ecosystem.config.js --env production

            # Wait for the API and SQLite health check before restarting the bot.
            if ! curl --fail --silent --show-error --retry 10 --retry-delay 3 \
              --retry-connrefused --max-time 5 http://127.0.0.1:1337/health \
              | grep -q '"status":"healthy"'; then
              echo "API health check failed after deployment" >&2
              exit 1
            fi

            # Deploy Bot
            cd "$DEPLOY_ROOT/bot"
            npm ci --omit=dev --no-audit --no-fund
            pm2 startOrRestart ecosystem.config.js --env production

            # Save PM2 process list
            pm2 status
            pm2 save --force
            EOF
